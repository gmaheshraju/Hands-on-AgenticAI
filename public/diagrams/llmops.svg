    <polyline points="1444.0,248 1444,208 756,208 756.0,248" fill="none" stroke="#9E9E9E" stroke-width="1.75" marker-end="url(#hoa_llmops_v1-a-d-edge-data_in)"/>
    <text x="1100.0" y="202.0" text-anchor="middle" fill="#888888" font-size="10" class="d-edge-label">response · tokens · cost</text>
  </g>
  <g class="d-edge d-edge-data_in" data-edge="e_cfg">
    <polyline points="1504.0,312 1504.0,352" fill="none" stroke="#9E9E9E" stroke-width="1.75" marker-end="url(#hoa_llmops_v1-a-d-edge-data_in)"/>
    <text x="1504.0" y="326.0" text-anchor="middle" fill="#888888" font-size="10" class="d-edge-label">pricing</text>
  </g>

  </g>
  <g class="d-edge d-edge-artifact" data-edge="e_ins">
    <polyline points="512,472.0 592,472.0" fill="none" stroke="#2E7D32" stroke-width="1.75" stroke-dasharray="6 3" marker-end="url(#hoa_llmops_v1-a-d-edge-artifact)"/>
    <text x="552.0" y="466.0" text-anchor="middle" fill="#888888" font-size="10" class="d-edge-label">INSERT</text>
  </g>
  <g class="d-edge d-edge-analysis" data-edge="e_rd">
    <polyline points="752,472.0 832,472.0" fill="none" stroke="#E65100" stroke-width="1.75" stroke-dasharray="4 4" marker-end="url(#hoa_llmops_v1-a-d-edge-analysis)"/>
    <text x="792.0" y="466.0" text-anchor="middle" fill="#888888" font-size="10" class="d-edge-label">SELECT</text>
  </g>
  <g class="d-edge d-edge-analysis" data-edge="e_api">
    <polyline points="992,472.0 1072,472.0" fill="none" stroke="#E65100" stroke-width="1.75" stroke-dasharray="4 4" marker-end="url(#hoa_llmops_v1-a-d-edge-analysis)"/>
    <text x="1032.0" y="466.0" text-anchor="middle" fill="#888888" font-size="10" class="d-edge-label">handleApi</text>
  </g>
  <g class="d-edge d-edge-analysis" data-edge="e_http">
    <polyline points="1232,472.0 1304,472 1304,584 1384,584.0" fill="none" stroke="#E65100" stroke-width="1.75" stroke-dasharray="4 4" marker-end="url(#hoa_llmops_v1-a-d-edge-analysis)"/>
    <text x="1304.0" y="522.0" text-anchor="middle" fill="#888888" font-size="10" class="d-edge-label">GET /api/metrics</text>
  </g>
  <g class="d-node d-component-entry" data-id="n_demo" data-class="component.entry">
    <rect x="64" y="248" width="128" height="64" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
    <text x="128.0" y="268.5" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">demo.js</text>
    <text x="128.0" y="283.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">50 queries</text>
    <text x="128.0" y="298.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">await route()</text>
  </g>
  <g class="d-node d-component-service" data-id="n_classify" data-class="component.service">
    <rect x="352" y="248" width="176" height="64" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="440.0" y="268.5" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">classify()</text>
    <text x="440.0" y="283.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">kw .50 len .30 str .20</text>
    <text x="440.0" y="298.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">classifier.js</text>
  </g>
  <g class="d-node d-component-agent" data-id="n_route" data-class="component.agent">
    <rect x="624" y="248" width="176" height="64" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
    <text x="712.0" y="261.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">route()</text>
    <text x="712.0" y="276.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">router.js</text>
    <text x="712.0" y="291.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">fallback chain</text>
    <text x="712.0" y="306.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">3 logRequest sites</text>
  </g>
  <g class="d-node d-component-mock" data-id="n_mock" data-class="component.mock">
    <rect x="1384" y="248" width="240" height="64" rx="6" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="1504.0" y="268.5" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">mockModelCall()</text>
    <text x="1504.0" y="283.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">MOCK — no network call</text>
    <text x="1504.0" y="298.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">0.3 fail rate, len&gt;300</text>
  </g>
  <g class="d-node d-component-external" data-id="n_cfg" data-class="component.external">
    <rect x="1384" y="352" width="240" height="64" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
    <text x="1504.0" y="372.5" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">MODEL_CONFIG</text>
    <text x="1504.0" y="387.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">5 models · 3 reachable</text>
    <text x="1504.0" y="402.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">ROUTING_TABLE</text>
  </g>
  <g class="d-node d-component-service" data-id="n_log" data-class="component.service">
    <rect x="352" y="440" width="160" height="64" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="432.0" y="460.5" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">logRequest()</text>
    <text x="432.0" y="475.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">metrics.js</text>
    <text x="432.0" y="490.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">INSERT · 12 columns</text>
  </g>
  <g class="d-node d-component-artifact" data-id="n_db" data-class="component.artifact">
    <rect x="592" y="440" width="160" height="64" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="672.0" y="460.5" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">metrics.db</text>
    <text x="672.0" y="475.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">SQLite WAL</text>
    <text x="672.0" y="490.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">requests table</text>
  </g>
  <g class="d-node d-component-service" data-id="n_read" data-class="component.service">
    <rect x="832" y="440" width="160" height="64" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="912.0" y="468.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">9 read queries</text>
    <text x="912.0" y="483.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">metrics.js</text>
  </g>
  <g class="d-node d-component-entry" data-id="n_server" data-class="component.entry">
    <rect x="1072" y="440" width="160" height="64" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
    <text x="1152.0" y="460.5" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">dashboard.js</text>
    <text x="1152.0" y="475.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">http</text>
    <text x="1152.0" y="490.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">11-key payload</text>
  </g>
  <g class="d-node d-component-external" data-id="n_browser" data-class="component.external">
    <rect x="1384" y="552" width="240" height="64" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
    <text x="1504.0" y="572.5" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">public/dashboard.html</text>
    <text x="1504.0" y="587.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">fetch /api/metrics</text>
    <text x="1504.0" y="602.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">auto-refresh 10s</text>
  </g>
  <g class="d-node d-card-invariant" data-id="card_route" data-class="card.invariant">
    <rect x="320" y="540" width="456" height="92" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="328" y="554.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">CLASSIFY → ROUTE — complete table, in code order</text>
    <text x="328" y="568.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">score = kw×0.50 + len×0.30 + struc×0.20 · classifier.js</text>
    <text x="328" y="582.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">tier: &lt;0.30 simple · &lt;0.55 medium · else complex</text>
    <text x="328" y="596.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">simple → haiku → sonnet → opus · router.js</text>
    <text x="328" y="610.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">medium → sonnet → opus · router.js</text>
    <text x="328" y="624.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">complex → opus, no fallback remains · router.js</text>
  </g>
  <g class="d-node d-card-failure" data-id="card_esc" data-class="card.failure">
    <rect x="800" y="540" width="456" height="92" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
    <text x="808" y="554.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">ESCALATION — LOW_QUALITY_SIGNALS, 6 in code order</text>
    <text x="808" y="568.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 len &lt; 20 · 2 /i don&#x27;t know/ · 3 /i&#x27;m not sure/</text>
    <text x="808" y="582.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4 /i cannot/ &amp; len&lt;100 · 5 /as an ai/ &amp; len&lt;150</text>
    <text x="808" y="596.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">6 endsWith(&#x27;...&#x27;) &amp; len&lt;80 — last in chain exempt</text>
    <text x="808" y="610.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">reason: response_too_short · low_quality_detected</text>
    <text x="808" y="624.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">error: &lt;err.message&gt; · all_models_exhausted</text>
  </g>
  <g class="d-node d-card-primitive" data-id="card_models" data-class="card.primitive">
    <rect x="320" y="668" width="456" height="104" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
    <text x="328" y="681.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">MODEL_CONFIG — 5 models in code order, $ per 1K</text>
    <text x="328" y="695.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">haiku · claude-haiku-4-5 · cheap · .001 / .005 · 200ms</text>
    <text x="328" y="709.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">gpt-4o-mini · cheap · .00015 / .0006 · 250ms</text>
    <text x="328" y="723.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">sonnet · claude-sonnet-5 · medium · .003 / .015 · 800ms</text>
    <text x="328" y="737.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">gpt-4o · medium · .0025 / .01 · 700ms</text>
    <text x="328" y="751.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">opus · claude-opus-5 · expensive · .005 / .025 · 2000ms</text>
    <text x="328" y="765.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">only haiku · sonnet · opus reachable — ROUTING_TABLE</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 800" role="img" aria-labelledby="hoa_llmops_v1-t hoa_llmops_v1-d" class="fts-diagram">
  <title id="hoa_llmops_v1-t">06 LLMOps — Model Router &amp; Cost Dashboard</title>
  <desc id="hoa_llmops_v1-d">A heuristic classifier scores each query, a router walks a per-tier fallback chain of mock models, every attempt is written to SQLite, and a second process serves aggregates to a browser dashboard. Every element cites a source line in FACTS.md.</desc>
  <defs>
    <marker id="hoa_llmops_v1-a-d-edge-analysis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E65100" class="d-edge-analysis-fill"/></marker>
    <marker id="hoa_llmops_v1-a-d-edge-artifact" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32" class="d-edge-artifact-fill"/></marker>
    <marker id="hoa_llmops_v1-a-d-edge-call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0" class="d-edge-call-fill"/></marker>
    <marker id="hoa_llmops_v1-a-d-edge-data_in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9E9E9E" class="d-edge-data_in-fill"/></marker>
    <marker id="hoa_llmops_v1-a-d-edge-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#232F3E" class="d-edge-primary-fill"/></marker>
  </defs>
  <g class="d-zone d-boundary-datasource">

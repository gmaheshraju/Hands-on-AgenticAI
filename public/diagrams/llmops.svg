    <polyline points="668.0,312 668,392 432,392 432.0,440" fill="none" stroke="#2E7D32" stroke-width="1.75" stroke-dasharray="6 3" marker-end="url(#hoa_llmops_v1-a-d-edge-artifact)"/>

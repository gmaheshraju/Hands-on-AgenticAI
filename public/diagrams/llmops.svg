    <text x="52" y="236" fill="#9E9E9E" font-size="12" font-weight="600" class="d-zone-label">③ Entry — npm run demo (demo.js)</text>
  </g>
  <g class="d-zone d-boundary-primary">
    <rect x="280" y="96" width="1016" height="680" rx="8" fill="none" stroke="#E7157B" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="292" y="116" fill="#E7157B" font-size="12" font-weight="600" class="d-zone-label">① 06-llmops — Node ESM + better-sqlite3</text>
  </g>
  <g class="d-zone d-boundary-functional">

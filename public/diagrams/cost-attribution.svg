    <text x="688.0" y="175.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">7 models</text>
    <text x="688.0" y="190.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">hardcoded · no API</text>

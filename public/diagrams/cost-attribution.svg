  <g class="d-node d-card-invariant" data-id="card_attr" data-class="card.invariant">
    <rect x="344" y="576" width="304" height="184" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="352" y="629.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">4 ATTRIBUTION DIMENSIONS — attribution.js</text>
    <text x="352" y="643.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 byAgent — cost·reqs·successRate·avg</text>
    <text x="352" y="657.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">2 byTeam — cost·uniqueAgents·models</text>
    <text x="352" y="671.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">3 byTaskType — costPerSuccess·rate</text>
    <text x="352" y="685.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4 byModel — tokens·cacheHitRate·avg</text>
    <text x="352" y="699.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">each reads collector.query()</text>
    <text x="352" y="713.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">sorted by totalCost desc</text>
  </g>
  <g class="d-node d-card-invariant" data-id="card_waste" data-class="card.invariant">
    <rect x="664" y="576" width="304" height="184" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="672" y="622.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">6 WASTE PATTERNS — waste.analyze()</text>
    <text x="672" y="636.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 overpowered_model — opus/gpt4o 85%</text>
    <text x="672" y="650.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">2 duplicate_requests — within 60s</text>
    <text x="672" y="664.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">3 excessive_retries — &gt;1 fail/task</text>
    <text x="672" y="678.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4 low_cache_hit_rate — &gt;10 &amp; &lt;10%</text>
    <text x="672" y="692.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">5 high_failure_rate — &gt;5 &amp; &gt;30%</text>
    <text x="672" y="706.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">6 idle_agent — &gt;1h idle, cost&gt;$.01</text>
    <text x="672" y="720.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">sorted by savingsUsd desc</text>
  </g>
  <g class="d-node d-card-failure" data-id="card_budget" data-class="card.failure">
    <rect x="984" y="576" width="304" height="184" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
    <text x="992" y="622.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">BUDGET ALERTS — engine._checkBudget</text>
    <text x="992" y="636.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">fires inside every record()</text>
    <text x="992" y="650.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">no budget set ⇒ skip</text>
    <text x="992" y="664.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">spend = today&#x27;s team cost</text>
    <text x="992" y="678.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">thresholds 0.5 · 0.8 · 0.95 · 1.0</text>
    <text x="992" y="692.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">level: ≥1.0 crit · ≥0.8 warn · info</text>
    <text x="992" y="706.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">deduped per team·threshold·day</text>
    <text x="992" y="720.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">alerts accrue on this.alerts[]</text>
  </g>
</svg>

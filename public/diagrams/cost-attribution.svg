<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 800" role="img" aria-labelledby="hoa_cost_attribution_v1-t hoa_cost_attribution_v1-d" class="fts-diagram">
  <title id="hoa_cost_attribution_v1-t">27 Cost Attribution — Facade over one event store, four read-models</title>
  <desc id="hoa_cost_attribution_v1-d">One in-memory process that records simulated LLM-call events into a single CostCollector store, then reports over it four ways: cost attribution (4 dimensions), waste detection (6 patterns), ROI, and budget alerts checked on every record. No network, no real LLM. Every element cites a source line in FACTS.md.</desc>

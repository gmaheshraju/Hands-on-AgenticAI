<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1180" role="img" aria-labelledby="hoa_coordinator_seq_v1-t hoa_coordinator_seq_v1-d" class="fts-diagram">
  <title id="hoa_coordinator_seq_v1-t">21 Multi-Agent Coordinator — a timeout that frees a busy slot</title>
  <desc id="hoa_coordinator_seq_v1-d">The concurrency slot is released when a timeout fires, but a timeout here cancels nothing. Three handlers ran at once on an agent declaring one, and the registry&#x27;s load counter never read above one the whole time.</desc>
  <defs>
    <marker id="hoa_coordinator_seq_v1-a-d-msg-call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#232F3E" class="d-msg-call-fill"/></marker>
    <marker id="hoa_coordinator_seq_v1-a-d-msg-failure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828" class="d-msg-failure-fill"/></marker>
  </defs>
  <g class="d-fragment" data-id="f_loop">
    <rect x="140" y="180" width="1440" height="640" rx="4" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-dasharray="8 4"/>
    <rect x="140" y="180" width="430.0" height="18" rx="3" fill="#2E7D32" fill-opacity="0.12" stroke="#2E7D32" stroke-width="1"/>
    <text x="147" y="193" fill="#2E7D32" font-size="11" font-weight="600" class="d-frag-label">the retry loop — every pass abandons a handler and frees its slot</text>
  </g>
  <g class="d-lifeline d-component-entry" data-id="coord" data-class="component.entry">
    <line x1="180" y1="156" x2="180" y2="856" stroke="#E65100" stroke-width="1.5" stroke-dasharray="4 5" class="d-lifeline-stem"/>
    <rect x="60.0" y="96" width="240" height="60" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <text x="180" y="122.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">Coordinator</text>
    <text x="180" y="137.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">the retry loop</text>
  </g>
  <g class="d-lifeline d-component-service" data-id="reg" data-class="component.service">
    <line x1="500" y1="156" x2="500" y2="856" stroke="#3F51B5" stroke-width="1.5" stroke-dasharray="4 5" class="d-lifeline-stem"/>
    <rect x="380.0" y="96" width="240" height="60" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="2"/>
    <text x="500" y="122.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">Registry</text>
    <text x="500" y="137.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">holds the agent&#x27;s load</text>
  </g>
  <g class="d-lifeline d-component-artifact" data-id="h0" data-class="component.artifact">
    <line x1="820" y1="156" x2="820" y2="856" stroke="#2E7D32" stroke-width="1.5" stroke-dasharray="4 5" class="d-lifeline-stem"/>
    <rect x="700.0" y="96" width="240" height="60" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2"/>
    <text x="820" y="122.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">handler</text>
    <text x="820" y="137.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">attempt 0</text>
  </g>
  <g class="d-lifeline d-component-artifact" data-id="h1" data-class="component.artifact">
    <line x1="1140" y1="156" x2="1140" y2="856" stroke="#2E7D32" stroke-width="1.5" stroke-dasharray="4 5" class="d-lifeline-stem"/>
    <rect x="1020.0" y="96" width="240" height="60" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2"/>
    <text x="1140" y="122.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">handler</text>
    <text x="1140" y="137.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">attempt 1</text>
  </g>
  <g class="d-lifeline d-component-artifact" data-id="h2" data-class="component.artifact">
    <line x1="1460" y1="156" x2="1460" y2="856" stroke="#2E7D32" stroke-width="1.5" stroke-dasharray="4 5" class="d-lifeline-stem"/>
    <rect x="1340.0" y="96" width="240" height="60" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2"/>
    <text x="1460" y="122.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">handler</text>
    <text x="1460" y="137.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">attempt 2</text>
  </g>
  <g class="d-msg d-msg-call" data-msg="m1">
    <line x1="180" y1="224" x2="500" y2="224" stroke="#232F3E" stroke-width="1.75" marker-end="url(#hoa_coordinator_seq_v1-a-d-msg-call)"/>
    <text x="340.0" y="217" text-anchor="middle" fill="#888888" font-size="11" class="d-msg-label">selectAgent — load 0, under the cap</text>
  </g>
  <g class="d-msg d-msg-call" data-msg="m2">
    <line x1="180" y1="268" x2="500" y2="268" stroke="#232F3E" stroke-width="1.75" marker-end="url(#hoa_coordinator_seq_v1-a-d-msg-call)"/>
    <text x="340.0" y="261" text-anchor="middle" fill="#888888" font-size="11" class="d-msg-label">incrementLoad — load is now 1</text>
  </g>
  <g class="d-msg d-msg-call" data-msg="m3">
    <line x1="180" y1="312" x2="820" y2="312" stroke="#232F3E" stroke-width="1.75" marker-end="url(#hoa_coordinator_seq_v1-a-d-msg-call)"/>
    <text x="500.0" y="305" text-anchor="middle" fill="#888888" font-size="11" class="d-msg-label">start the handler, raced against a timer</text>
  </g>
  <g class="d-msg d-msg-failure" data-msg="m4">
    <polyline points="180,356 268,356 268,376 184,376" fill="none" stroke="#C62828" stroke-width="1.75" marker-end="url(#hoa_coordinator_seq_v1-a-d-msg-failure)"/>
    <text x="276" y="352" text-anchor="start" fill="#888888" font-size="11" class="d-msg-label">the timer wins the race — the handler does not stop</text>
  </g>
  <g class="d-msg d-msg-failure" data-msg="m5">
    <line x1="180" y1="400" x2="500" y2="400" stroke="#C62828" stroke-width="1.75" marker-end="url(#hoa_coordinator_seq_v1-a-d-msg-failure)"/>
    <text x="340.0" y="393" text-anchor="middle" fill="#888888" font-size="11" class="d-msg-label">decrementLoad — load 0, but attempt 0 is still live</text>
  </g>
  <g class="d-msg d-msg-call" data-msg="m6">
    <line x1="180" y1="444" x2="500" y2="444" stroke="#232F3E" stroke-width="1.75" marker-end="url(#hoa_coordinator_seq_v1-a-d-msg-call)"/>
    <text x="340.0" y="437" text-anchor="middle" fill="#888888" font-size="11" class="d-msg-label">selectAgent — reads the freed counter, passes</text>
  </g>
  <g class="d-msg d-msg-call" data-msg="m7">
    <line x1="180" y1="488" x2="500" y2="488" stroke="#232F3E" stroke-width="1.75" marker-end="url(#hoa_coordinator_seq_v1-a-d-msg-call)"/>
    <text x="340.0" y="481" text-anchor="middle" fill="#888888" font-size="11" class="d-msg-label">incrementLoad — load is 1 again</text>
  </g>
  <g class="d-msg d-msg-call" data-msg="m8">
    <line x1="180" y1="532" x2="1140" y2="532" stroke="#232F3E" stroke-width="1.75" marker-end="url(#hoa_coordinator_seq_v1-a-d-msg-call)"/>
    <text x="660.0" y="525" text-anchor="middle" fill="#888888" font-size="11" class="d-msg-label">start a SECOND handler — two are now live</text>
  </g>
  <g class="d-msg d-msg-failure" data-msg="m9">
    <polyline points="180,576 268,576 268,596 184,596" fill="none" stroke="#C62828" stroke-width="1.75" marker-end="url(#hoa_coordinator_seq_v1-a-d-msg-failure)"/>
    <text x="276" y="572" text-anchor="start" fill="#888888" font-size="11" class="d-msg-label">the timer wins again</text>
  </g>
  <g class="d-msg d-msg-failure" data-msg="m10">
    <line x1="180" y1="620" x2="500" y2="620" stroke="#C62828" stroke-width="1.75" marker-end="url(#hoa_coordinator_seq_v1-a-d-msg-failure)"/>
    <text x="340.0" y="613" text-anchor="middle" fill="#888888" font-size="11" class="d-msg-label">decrementLoad — load 0, two handlers still live</text>
  </g>
  <g class="d-msg d-msg-call" data-msg="m11">
    <line x1="180" y1="664" x2="500" y2="664" stroke="#232F3E" stroke-width="1.75" marker-end="url(#hoa_coordinator_seq_v1-a-d-msg-call)"/>
    <text x="340.0" y="657" text-anchor="middle" fill="#888888" font-size="11" class="d-msg-label">selectAgent — passes a third time</text>
  </g>
  <g class="d-msg d-msg-call" data-msg="m12">
    <line x1="180" y1="708" x2="500" y2="708" stroke="#232F3E" stroke-width="1.75" marker-end="url(#hoa_coordinator_seq_v1-a-d-msg-call)"/>
    <text x="340.0" y="701" text-anchor="middle" fill="#888888" font-size="11" class="d-msg-label">incrementLoad — load is 1 again</text>
  </g>
  <g class="d-msg d-msg-call" data-msg="m13">
    <line x1="180" y1="752" x2="1460" y2="752" stroke="#232F3E" stroke-width="1.75" marker-end="url(#hoa_coordinator_seq_v1-a-d-msg-call)"/>
    <text x="820.0" y="745" text-anchor="middle" fill="#888888" font-size="11" class="d-msg-label">start a THIRD handler — three are now live</text>
  </g>
  <g class="d-msg d-msg-failure" data-msg="m14">
    <polyline points="180,796 268,796 268,816 184,816" fill="none" stroke="#C62828" stroke-width="1.75" marker-end="url(#hoa_coordinator_seq_v1-a-d-msg-failure)"/>
    <text x="276" y="792" text-anchor="start" fill="#888888" font-size="11" class="d-msg-label">retries exhausted; the task is reported failed</text>
  </g>
  <g class="d-node d-card-failure" data-id="card_measured" data-class="card.failure">
    <rect x="96" y="896" width="880" height="232" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
    <text x="104" y="938.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">MEASURED — THREE AT ONCE ON AN AGENT THAT DECLARED ONE</text>
    <text x="104" y="952.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">One agent with maxConcurrency 1, a handler taking 900ms, a 200ms task timeout</text>
    <text x="104" y="966.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">and two retries. The handler counts itself in and out, so live handlers are</text>
    <text x="104" y="980.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">counted directly rather than inferred.</text>
    <text x="104" y="994.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">RAN — declared maxConcurrency 1. PEAK concurrent live handlers: 3.</text>
    <text x="104" y="1008.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">RAN — the load values the registry ever showed: 1 and 0. Maximum observed: 1.</text>
    <text x="104" y="1022.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">The second line is the one that matters. The cap is not merely exceeded, the</text>
    <text x="104" y="1036.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">overage is INVISIBLE. Every routing decision that consults load — the sort that</text>
    <text x="104" y="1050.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">prefers the least loaded agent, and the refusal at the cap — is reading a</text>
    <text x="104" y="1064.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">number that does not describe the system.</text>
    <text x="104" y="1078.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">Three rather than two because two retries give three passes, and each pass</text>
    <text x="104" y="1092.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">leaves its handler behind.</text>
  </g>
  <g class="d-node d-card-invariant" data-id="card_correct" data-class="card.invariant">
    <rect x="1008" y="896" width="612" height="232" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="1016" y="945.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">WHAT IS ACTUALLY CORRECT HERE, AND WHY THAT MATTERS</text>
    <text x="1016" y="959.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">The check and the reserve are adjacent with no await between them, so the</text>
    <text x="1016" y="973.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">ordinary check-then-act race is genuinely absent — two callers cannot both</text>
    <text x="1016" y="987.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">pass the cap. That part was written carefully.</text>
    <text x="1016" y="1001.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">The defect is the RELEASE. It is issued when a timer wins a race, and winning</text>
    <text x="1016" y="1015.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">that race stops nothing: Promise.race cannot cancel its loser, and nothing</text>
    <text x="1016" y="1029.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">here tries to.</text>
    <text x="1016" y="1043.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">The timeout wraps every skill invocation and defaults to ten seconds, so this</text>
    <text x="1016" y="1057.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">is the ordinary route, not an exotic configuration.</text>
    <text x="1016" y="1071.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">No fix is drawn. Cancelling needs a channel the skill interface does not have,</text>
    <text x="1016" y="1085.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">and holding the slot until the handler settles changes what a timeout means.</text>
  </g>
</svg>

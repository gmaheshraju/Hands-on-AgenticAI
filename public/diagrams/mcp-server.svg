<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 800" role="img" aria-labelledby="hoa_mcp_server_v1-t hoa_mcp_server_v1-d" class="fts-diagram">
  <title id="hoa_mcp_server_v1-t">15 MCP Server + Client — Architecture</title>
  <desc id="hoa_mcp_server_v1-d">Two OS processes joined by one pipe: three client programs share a Client that spawns node server.js as a child and speaks JSON-RPC 2.0 over its stdio, and a sqlite-explorer server whose whole declared surface is 3 tools and 2 resources over one shared SQLite handle. Every element cites a source line in FACTS.md.</desc>

  <g class="d-node d-component-service" data-id="n_dbmod" data-class="component.service">
    <rect x="1232" y="272" width="256" height="96" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="1360.0" y="301.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">database.js</text>
    <text x="1360.0" y="316.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">getDatabase -&gt; create</text>
    <text x="1360.0" y="331.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">seedDatabase, idempotent</text>
    <text x="1360.0" y="346.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">5 tables + 4 indexes</text>
  </g>
  <g class="d-node d-component-artifact" data-id="n_db" data-class="component.artifact">
    <rect x="1232" y="440" width="256" height="80" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="1360.0" y="461.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">ecommerce.db</text>
    <text x="1360.0" y="476.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">SQLite, WAL · path</text>
    <text x="1360.0" y="491.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">8 cat, 50 users, 30 products</text>
    <text x="1360.0" y="506.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">200 orders, 1-5 items each</text>
  </g>
  <g class="d-node d-card-invariant" data-id="card_gate" data-class="card.invariant">
    <rect x="288" y="512" width="456" height="160" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="296" y="525.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">query TOOL — EVERY GUARD, IN CODE ORDER · server.js</text>
    <text x="296" y="539.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">trimmed = sql.trim().toUpperCase()</text>
    <text x="296" y="553.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 must start with SELECT — else refusal</text>
    <text x="296" y="567.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">withoutStrings = literals blanked — checks 2-4 run on this copy</text>
    <text x="296" y="581.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">2 split on &#x27;;&#x27;, more than one statement — refusal</text>
    <text x="296" y="595.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">3 17 blocked keywords, anywhere incl. subqueries — refusal</text>
    <text x="296" y="609.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4 SQL comments -- or /* — refusal</text>
    <text x="296" y="623.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">then effectiveLimit = min(limit || 100, 1000)</text>
    <text x="296" y="637.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"> LIMIT appended when the SQL has none</text>
    <text x="296" y="651.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"> db.prepare(execSql).all() -&gt; { rowCount, rows }</text>
    <text x="296" y="665.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">catch -&gt; { error } + isError — the handler never throws</text>
  </g>
  <g class="d-node d-card-failure" data-id="card_deny" data-class="card.failure">
    <rect x="288" y="688" width="456" height="88" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
    <text x="296" y="700.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">BLOCKED KEYWORDS — all 17, in regex order · server.js</text>
    <text x="296" y="714.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">DROP · ALTER · CREATE · DELETE · INSERT · UPDATE · TRUNCATE</text>
    <text x="296" y="728.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">REPLACE · EXEC · EXECUTE · GRANT · REVOKE · ATTACH · DETACH</text>
    <text x="296" y="742.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">PRAGMA · REINDEX · VACUUM case-insensitive, word-boundary</text>
    <text x="296" y="756.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4 refusals in query, 1 in describe_table</text>
    <text x="296" y="770.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">every one is a normal MCP result carrying isError — not an exception</text>
  </g>
  <g class="d-node d-card-primitive" data-id="card_surface" data-class="card.primitive">
    <rect x="776" y="592" width="456" height="116" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
    <text x="784" y="604.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">MCP SURFACE — the complete declared set · server.js</text>
    <text x="784" y="618.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">TOOL query(sql, limit? = 100, capped at 1000)</text>
    <text x="784" y="632.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">TOOL list_tables() — no params</text>
    <text x="784" y="646.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">TOOL describe_table(table_name)</text>
    <text x="784" y="660.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">RES db://schema application/json</text>
    <text x="784" y="674.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">RES db://stats application/json</text>
    <text x="784" y="688.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">these 5 and nothing else — no server.prompt() exists in src/</text>
    <text x="784" y="702.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">client learns them at runtime: listTools, listResources</text>
  </g>
</svg>

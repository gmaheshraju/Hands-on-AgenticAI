  <g class="d-node d-component-artifact" data-id="n_deny" data-class="component.artifact">
    <rect x="1384" y="684" width="248" height="56" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="1508.0" y="700.5" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">stdout — refusal</text>
    <text x="1508.0" y="715.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">PERMISSION DENIED</text>
    <text x="1508.0" y="730.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">CONFIRMATION REQUIRED</text>
  </g>
  <g class="d-node d-card-invariant" data-id="card_gate" data-class="card.invariant">
    <rect x="304" y="496" width="456" height="112" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="312" y="513.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">validateQuery() — EVERY check, in code order · permissions.js</text>
    <text x="312" y="527.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">BLOCK 1 multiple statements &#x27;;&#x27; · 2 first keyword not SELECT</text>
    <text x="312" y="541.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">BLOCK 3 destructive keyword x14 · 4 metadata table x6</text>
    <text x="312" y="555.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">BLOCK 5 load_extension · 6 table not in allowedTables</text>
    <text x="312" y="569.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">BLOCK 7 subquery depth &gt; 2 · 8 UNION + constant</text>
    <text x="312" y="583.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">CONFIRM 9 over 3 JOINs · 10 no WHERE clause (one result)</text>
    <text x="312" y="597.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">ALLOW fall-through only — first match wins; order is load-bearing</text>
  </g>
  <g class="d-node d-card-failure" data-id="card_deny" data-class="card.failure">
    <rect x="304" y="632" width="456" height="96" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
    <text x="312" y="648.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">DENY LISTS — complete, in declaration order</text>
    <text x="312" y="662.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">destructive — INSERT UPDATE DELETE DROP ALTER CREATE</text>
    <text x="312" y="676.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">TRUNCATE REPLACE EXEC ATTACH DETACH PRAGMA GRANT REVOKE (14)</text>
    <text x="312" y="690.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">metadata — information_schema sqlite_master sqlite_schema</text>
    <text x="312" y="704.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">sqlite_temp_master pg_catalog pg_tables (6) · load_extension</text>
    <text x="312" y="718.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">allowedTables database.js — users products orders events (4)</text>
  </g>
  <g class="d-node d-card-primitive" data-id="card_attempt" data-class="card.primitive">
    <rect x="792" y="496" width="456" height="232" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
    <text x="800" y="517.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">ONE ask() ATTEMPT — 4 steps in code order · agent.js</text>
    <text x="800" y="531.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 llm(messages) — md fences + trailing &#x27;;&#x27; stripped</text>
    <text x="800" y="545.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">2 validateQuery(sql, allowedTables)</text>
    <text x="800" y="559.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"> !allowed -&gt; &#x27;PERMISSION DENIED&#x27;, return</text>
    <text x="800" y="573.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"> needsConfirm and !autoConfirm -&gt; return — never retried</text>
    <text x="800" y="587.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">3 estimateQueryCost(db, sql) — EXPLAIN QUERY PLAN</text>
    <text x="800" y="601.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4 db.prepare(sql).all() — timed by performance.now()</text>
    <text x="800" y="615.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"> on throw -&gt; errors.push + retry prompt appended</text>
    <text x="800" y="629.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"></text>
    <text x="800" y="643.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">4 ATTEMPTS MAX — attempt = 0..maxRetries, default 3</text>
    <text x="800" y="657.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">exhausted -&gt; &#x27;Failed after N attempts&#x27; + error list</text>
    <text x="800" y="671.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"></text>
    <text x="800" y="685.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">AgentResult envelope — 10 fields · agent.js</text>
    <text x="800" y="699.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">success · question · sql · rows · formatted · permission</text>
    <text x="800" y="713.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">cost · attempts · errors · executionTimeMs</text>
  </g>
</svg>

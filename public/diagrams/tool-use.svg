  <title id="hoa_tool_use_v1-t">10 Tool Use — SQL Analytics Agent Architecture</title>
  <desc id="hoa_tool_use_v1-d">A text-to-SQL agent whose security boundary is a code-enforced SQL validator, not a prompt: CLI question, LLM seam, ten-check permission gate, EXPLAIN-based cost estimate, better-sqlite3 execution against a seeded local file, and the two stdout outcomes. Every element cites a source line in FACTS.md.</desc>

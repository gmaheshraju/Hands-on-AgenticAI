<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 800" role="img" aria-labelledby="hoa_compliance_audit_v1-t hoa_compliance_audit_v1-d" class="fts-diagram">
  <title id="hoa_compliance_audit_v1-t">28 Compliance-Audit — Tamper-Evident Audit Harness</title>
  <desc id="hoa_compliance_audit_v1-d">One in-memory Node process that logs agent events into a SHA-256 hash chain, replays decisions for determinism, checks 12 rules across EU AI Act / SOC2 / GDPR, and emits a Markdown compliance report to stdout. EventLogger is the shared store the other subsystems read — not four flat siblings as the README ASCII implies. Every element cites a source line in FACTS.md.</desc>

  <g class="d-node d-card-invariant" data-id="card_chain" data-class="card.invariant">
    <rect x="344" y="592" width="304" height="176" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="352" y="620.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">TAMPER-EVIDENT HASH CHAIN — eventLogger.js</text>
    <text x="352" y="634.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">11 entry fields, in code order:</text>
    <text x="352" y="648.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"> id·timestamp·agentId·action :73</text>
    <text x="352" y="662.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"> input·output·decision·rationale :77</text>
    <text x="352" y="676.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"> metadata·previousHash·hash :81-85</text>
    <text x="352" y="690.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">genesis prevHash = 64×&#x27;0&#x27; :70</text>
    <text x="352" y="704.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">hash = SHA-256(prevHash + entry) :40</text>
    <text x="352" y="718.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">entries Object.freeze on append :87</text>
    <text x="352" y="732.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">verifyChain → brokenAt index :135</text>
    <text x="352" y="746.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">redact 12 keys before hashing :33</text>
  </g>
  <g class="d-node d-card-invariant" data-id="card_rules" data-class="card.invariant">
    <rect x="664" y="592" width="304" height="176" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="672" y="606.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">12 RULES · 3 REGS — complianceFramework.js</text>
    <text x="672" y="620.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">EU AI Act :10 — 4 rules</text>
    <text x="672" y="634.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"> explainability H:12 · audit-trail C:31</text>
    <text x="672" y="648.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"> human-review H:51 · protected C:76</text>
    <text x="672" y="662.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">SOC2 :105 — 4 rules</text>
    <text x="672" y="676.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"> agent-id H:107 · immutable-log C:126</text>
    <text x="672" y="690.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"> redaction C:144 · config-change M:174</text>
    <text x="672" y="704.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">GDPR :196 — 4 rules</text>
    <text x="672" y="718.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"> data-min H:198 · purpose M:229</text>
    <text x="672" y="732.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"> erasure H:248 · retention M:269</text>
    <text x="672" y="746.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">check → score = passed/total :369</text>
    <text x="672" y="760.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">H high · C critical · M medium</text>
  </g>
  <g class="d-node d-card-failure" data-id="card_risk" data-class="card.failure">
    <rect x="984" y="592" width="304" height="176" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
    <text x="992" y="613.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">RISK ESCALATION — complianceFramework.js:387</text>
    <text x="992" y="627.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">overallRisk, first match wins:</text>
    <text x="992" y="641.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"> critical if critical &gt; 0 :388</text>
    <text x="992" y="655.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"> high if high &gt; 1 :389</text>
    <text x="992" y="669.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"> medium if high&gt;0 or medium&gt;1 :390</text>
    <text x="992" y="683.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"> low otherwise :387</text>
    <text x="992" y="697.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">fail tally by severity :383</text>
    <text x="992" y="711.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">critical → criticalFindings → P0 :396</text>
    <text x="992" y="725.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">report: summary · tables · matrix</text>
    <text x="992" y="739.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label"> · P0/P1/P2 roadmap :104</text>
    <text x="992" y="753.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">observed run: 92% · MEDIUM · 0 crit</text>
  </g>

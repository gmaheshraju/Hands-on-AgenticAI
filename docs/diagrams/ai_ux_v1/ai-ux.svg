  <g class="d-node d-card-invariant" data-id="card_events" data-class="card.invariant">
    <rect x="384" y="520" width="424" height="92" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="392" y="534.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">SSE EVENT TYPES — all 8, in first-emission order · server.js</text>
    <text x="392" y="548.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 stream_start · 2 stream_stop</text>
    <text x="392" y="562.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">3 thinking · 4 token (text + confidence)</text>
    <text x="392" y="576.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">5 citation · 6 hitl_request</text>
    <text x="392" y="590.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">7 done · 8 error</text>
    <text x="392" y="604.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">client also listens &#x27;error_event&#x27; — no server emitter</text>
  </g>
  <g class="d-node d-card-primitive" data-id="card_router" data-class="card.primitive">
    <rect x="832" y="520" width="424" height="92" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
    <text x="840" y="534.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">SCENARIO ROUTER — 8 entries, first match wins · agent.js</text>
    <text x="840" y="548.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 refund_policy /refund|return|money back/i</text>
    <text x="840" y="562.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">2 send_email · 3 database_query — the two HITL flows</text>
    <text x="840" y="576.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4 rate_limit · 5 context_long · 6 timeout</text>
    <text x="840" y="590.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">7 network_error · 8 default /.*/</text>
    <text x="840" y="604.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">loop skips &#x27;default&#x27;, returns it as fallback</text>
  </g>
  <g class="d-node d-card-failure" data-id="card_errors" data-class="card.failure">
    <rect x="384" y="648" width="872" height="92" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
    <text x="392" y="662.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">TYPED ERROR BRANCHES — the complete switch · chat.js</text>
    <text x="392" y="676.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 rate_limit — live countdown; the server itself auto-retries after retry_after s (server.js)</text>
    <text x="392" y="690.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">2 context_too_long — Summarize and Continue / Start New Chat</text>
    <text x="392" y="704.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">3 timeout — Try Again / Dismiss, prints elapsed seconds</text>
    <text x="392" y="718.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4 network_error — Retry Now; header status flips to Disconnected</text>
    <text x="392" y="732.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">5 default — Something Went Wrong / Try Again. Only branch 1 leaves the stream alive.</text>
  </g>
</svg>

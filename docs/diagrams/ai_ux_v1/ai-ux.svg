<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 800" role="img" aria-labelledby="hoa_ai_ux_v1-t hoa_ai_ux_v1-d" class="fts-diagram">
  <title id="hoa_ai_ux_v1-t">12 AI UX — Production Chat Trust Signals — Architecture</title>
  <desc id="hoa_ai_ux_v1-d">A vanilla-JS browser client and an Express server joined by one SSE connection per message: the scenario router, the event pump and its eight event types, the HITL park that holds the connection open on a Promise, the stop path, and the single durable artifact (browser localStorage). Every element cites a source line in FACTS.md.</desc>

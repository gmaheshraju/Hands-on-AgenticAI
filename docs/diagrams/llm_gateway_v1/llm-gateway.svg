<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 800" role="img" aria-labelledby="hoa_llm_gateway_v1-t hoa_llm_gateway_v1-d" class="fts-diagram">
  <title id="hoa_llm_gateway_v1-t">24 LLM Gateway — Routing &amp; Governance Pipeline</title>
  <desc id="hoa_llm_gateway_v1-d">One request() call threads every LLM request through a fixed 7-stage governance pipeline — budget, rate, PII, route, middleware, execute, track — over a hardcoded 7-model registry and runtime-injected (mocked) provider handlers, with the circuit breaker gating provider calls and the audit log written at every stage. Every element cites a source line in FACTS.md.</desc>

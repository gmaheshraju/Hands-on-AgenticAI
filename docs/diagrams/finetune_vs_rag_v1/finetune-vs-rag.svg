    <text x="824" y="672.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">SIMULATED, NOT REAL — the complete list</text>
    <text x="824" y="686.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 no fine-tuned model: a persona prompt stands in</text>
    <text x="824" y="700.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">2 its latency is the real API latency × 0.6</text>
    <text x="824" y="714.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">3 no vector DB: in-process TF-IDF maps</text>
    <text x="824" y="728.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4 tokens are text.length / 4, never metered</text>
    <text x="824" y="742.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">5 no API key → generateSampleResults() invents them</text>
  </g>

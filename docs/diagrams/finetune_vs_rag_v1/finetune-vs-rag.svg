    <text x="360" y="560.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">DATA QUALITY GATE — 5 checks, complete, in code order</text>
    <text x="360" y="574.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 imbalance max/min &gt; 2 · 2 corpus &lt; 50</text>

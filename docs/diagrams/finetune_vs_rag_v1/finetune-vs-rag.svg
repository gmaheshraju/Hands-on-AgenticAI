  <title id="hoa_finetune_vs_rag_v1-t">09 Fine-Tuning vs RAG — Architecture</title>
  <desc id="hoa_finetune_vs_rag_v1-d">One ticket-classification problem solved four ways over the same 30 held-out tickets: zero-shot, few-shot, TF-IDF retrieval, and a mocked fine-tuned model. The evaluation harness, the single external API, the three artifacts it writes, and what is simulated rather than real. Every element cites a source line in FACTS.md.</desc>

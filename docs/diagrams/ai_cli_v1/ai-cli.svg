  <title id="hoa_ai_cli_v1-t">20 aidev — AI-Powered Developer CLI</title>
  <desc id="hoa_ai_cli_v1-d">A zero-dependency Node CLI that routes commit / review / explain to an LLM client, which either runs in-process mock heuristics (demo or over-budget) or calls the real OpenAI / Anthropic APIs, tracking cost to ~/.aidev-usage.json. Every element cites a source line in FACTS.md.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 800" role="img" aria-labelledby="hoa_agent_mesh_v1-t hoa_agent_mesh_v1-d" class="fts-diagram">
  <title id="hoa_agent_mesh_v1-t">29 Agent Mesh — Self-Healing Orchestrator</title>
  <desc id="hoa_agent_mesh_v1-d">One in-memory Node process (no network, no DB, no real LLM) that routes work to worker nodes, watches their heartbeats, and — when the Mesh (which owns the event bus) sees a node_failed event — trips the node&#x27;s breaker, excludes it, and redistributes its pending work. Every element cites a source line in FACTS.md.</desc>
  <defs>
    <marker id="hoa_agent_mesh_v1-a-d-edge-artifact" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32" class="d-edge-artifact-fill"/></marker>
    <marker id="hoa_agent_mesh_v1-a-d-edge-call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0" class="d-edge-call-fill"/></marker>
    <marker id="hoa_agent_mesh_v1-a-d-edge-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#232F3E" class="d-edge-primary-fill"/></marker>
    <marker id="hoa_agent_mesh_v1-a-d-edge-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828" class="d-edge-stop-fill"/></marker>
  </defs>
  <g class="d-zone d-boundary-datasource">

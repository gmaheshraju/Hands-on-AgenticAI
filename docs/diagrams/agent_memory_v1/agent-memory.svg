    <text x="144.0" y="264.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">cli.js</text>
    <text x="144.0" y="279.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">interactive readline</text>

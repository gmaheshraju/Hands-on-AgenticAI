    <rect x="64" y="380" width="160" height="64" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
    <text x="144.0" y="408.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">demo.js</text>
    <text x="144.0" y="423.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">4-session demo</text>
  </g>
  <g class="d-node d-component-service" data-id="n_agent" data-class="component.service">
    <rect x="408" y="252" width="176" height="64" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="496.0" y="280.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">CRMAgent</text>
    <text x="496.0" y="295.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">classify · route</text>
  </g>
  <g class="d-node d-component-service" data-id="n_consol" data-class="component.service">
    <rect x="664" y="252" width="176" height="64" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="752.0" y="280.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">Consolidation</text>
    <text x="752.0" y="295.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">consolidation.js</text>

  <g class="d-node d-component-external" data-id="n_sqlite" data-class="component.external">
    <rect x="1368" y="248" width="248" height="64" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
    <text x="1492.0" y="276.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">better-sqlite3</text>
    <text x="1492.0" y="291.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">sync driver · package.json</text>
  </g>
  <g class="d-node d-component-artifact" data-id="n_dbfile" data-class="component.artifact">
    <rect x="1368" y="484" width="248" height="72" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="1492.0" y="508.5" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">crm_memory.db</text>
    <text x="1492.0" y="523.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">all three memory types</text>
    <text x="1492.0" y="538.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">memory.js</text>
  </g>
  <g class="d-node d-card-invariant" data-id="card_gate" data-class="card.invariant">
    <rect x="408" y="596" width="456" height="116" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="416" y="629.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">CONSOLIDATION GATE — when it fires</text>
    <text x="416" y="643.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 unconsolidatedCount = countUnconsolidated()</text>
    <text x="416" y="657.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">2 urgent = count &gt; 0 AND raw_input matches</text>
    <text x="416" y="671.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">3 NOT urgent AND count &lt; threshold → return ran:false</text>
    <text x="416" y="685.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4 else gather (urgent ? all : threshold, oldest first)</text>
  </g>
  <g class="d-node d-card-invariant" data-id="card_fact" data-class="card.invariant">
    <rect x="904" y="400" width="344" height="148" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="912" y="442.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">addFact — create vs update</text>
    <text x="912" y="456.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 query existing row: subject+predicate</text>
    <text x="912" y="470.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">2 none → INSERT (created)</text>
    <text x="912" y="484.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">3 exists → detectContradiction, merge sources</text>
    <text x="912" y="498.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4 contradiction → halve existing confidence in place</text>
    <text x="912" y="512.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">5 else UPDATE object · confidence · sources</text>
  </g>
  <g class="d-node d-card-invariant" data-id="card_decay" data-class="card.invariant">
    <rect x="904" y="604" width="344" height="128" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="912" y="643.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">decayMemories — per-fact outcome</text>
    <text x="912" y="657.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">ageDays ≤ 0 → untouched</text>
    <text x="912" y="671.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">else confidence × 2^(−ageDays / halfLife)</text>
    <text x="912" y="685.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">&lt; archiveThreshold (0.1) → archived + stale</text>
    <text x="912" y="699.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">else Δ &gt; 0.001 → updated, otherwise untouched</text>
  </g>
</svg>

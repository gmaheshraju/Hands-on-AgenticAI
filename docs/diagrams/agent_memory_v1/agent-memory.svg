  <title id="hoa_agent_memory_v1-t">02 Agent Memory — Personal CRM Agent</title>
  <desc id="hoa_agent_memory_v1-d">A CLI agent that logs every turn as an episodic SQLite row, consolidates episodes into semantic facts with contradiction and decay hygiene, and answers queries through hybrid retrieval — all state persisted in one on-disk SQLite file so memory survives restarts.</desc>

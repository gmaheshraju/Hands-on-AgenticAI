<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 800" role="img" aria-labelledby="hoa_agent_cicd_v1-t hoa_agent_cicd_v1-d" class="fts-diagram">
  <title id="hoa_agent_cicd_v1-t">26 Agent CI/CD — Eval Suite + Quality Gates for AI Agents</title>
  <desc id="hoa_agent_cicd_v1-d">One in-process pipeline that runs an eval suite against an agent-under-test, compares the scores to a stored baseline, applies quality-gate rules, and decides promote / block — all in four ordered stages, no network and no real LLM. Every element cites a source line in FACTS.md.</desc>

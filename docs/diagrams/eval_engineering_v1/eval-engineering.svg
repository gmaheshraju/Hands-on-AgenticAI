  <title id="hoa_eval_engineering_v1-t">08 Eval Engineering — Architecture</title>
  <desc id="hoa_eval_engineering_v1-d">The RAG eval harness: a golden Q&amp;A set and a RAG system under test enter a nine-step runEval() pipeline, an LLM-as-judge scores three calibrated dimensions against either Gemini or a mock backend, regression gates decide PASS/FAIL against a saved baseline, and a markdown report plus a new baseline are written. Every element cites a source line in FACTS.md.</desc>

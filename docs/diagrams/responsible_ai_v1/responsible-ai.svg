  <title id="hoa_responsible_ai_v1-t">13 Responsible AI — Bias Audit Pipeline Architecture</title>
  <desc id="hoa_responsible_ai_v1-d">The bias-audit pipeline that interrogates an opaque resume scorer: fixture-driven matched pairs, counterfactual testing across the system-under-test boundary, four from-scratch fairness tests, an optional intersectional branch, and the EU AI Act model card written as Markdown and JSON. Every element cites a source line in FACTS.md.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 820" role="img" aria-labelledby="hoa_agent_chat_v1-t hoa_agent_chat_v1-d" class="fts-diagram">
  <title id="hoa_agent_chat_v1-t">31 Agent Chat — Decision-Quality Observability for an LLM Agent</title>
  <desc id="hoa_agent_chat_v1-d">A single Node process serves a streaming LLM agent whose headline feature is decision-quality observability: an AgentObserver scores every decision (not every span) and writes a per-run report card to SQLite. Browser and upstream providers are the two external surfaces; the pipeline lives in one async generator. Every element cites a source line in FACTS.md.</desc>

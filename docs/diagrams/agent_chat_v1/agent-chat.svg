    <text x="352" y="675.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">   respond OR result used ⇒ productive :141</text>
    <text x="352" y="689.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4 Confidence signals (from thought) :183</text>
    <text x="352" y="703.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">   hedging·confident·uncertain·</text>
    <text x="352" y="717.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">   seeking_info·ready_to_answer :189</text>
    <text x="352" y="731.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">5 Strategy :173</text>
    <text x="352" y="745.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">   direct·single_tool·multi_tool·iterative</text>
    <text x="352" y="759.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">→ persisted: agent_runs + decisions :86 :78</text>
  </g>

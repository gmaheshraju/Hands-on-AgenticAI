    <text x="144.0" y="279.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">mock LLM + fixtures</text>
  </g>
  <g class="d-node d-component-entry" data-id="n_live" data-class="component.entry">
    <rect x="64" y="380" width="160" height="64" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
    <text x="144.0" y="408.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">review.js</text>
    <text x="144.0" y="423.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">real GitHub + LLM</text>
  </g>
  <g class="d-node d-component-service" data-id="n_react" data-class="component.service">
    <rect x="408" y="252" width="176" height="64" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="496.0" y="280.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">runReActLoop()</text>
    <text x="496.0" y="295.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">agent.js</text>

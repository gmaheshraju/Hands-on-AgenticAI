  <g class="d-node d-component-artifact" data-id="n_findings" data-class="component.artifact">
    <rect x="1368" y="700" width="248" height="72" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="1492.0" y="724.5" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">Findings JSON</text>

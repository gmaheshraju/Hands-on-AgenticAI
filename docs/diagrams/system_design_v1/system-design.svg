  <g class="d-node d-card-invariant" data-id="card_exit" data-class="card.invariant">
    <rect x="408" y="540" width="456" height="152" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="416" y="570.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">HOW ONE ITERATION EXITS — complete, in code order</text>
    <text x="416" y="584.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 FINISH unparseable → retry message</text>
    <text x="416" y="598.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">2 FINISH valid → validate · dedupe · sort · return</text>
    <text x="416" y="612.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">3 unknown tool → error observation</text>
    <text x="416" y="626.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4 stall xN identical → force-finish</text>
    <text x="416" y="640.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">5 neither FINISH nor ACTION → parse retry</text>
    <text x="416" y="654.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">6 maxIterations → empty output, cappedOut</text>
    <text x="416" y="668.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">&lt;i&gt;findings sort: bug → security → suggestion → nit · schema.js&lt;/i&gt;</text>
  </g>

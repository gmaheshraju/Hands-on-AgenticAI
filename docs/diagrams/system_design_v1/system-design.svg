<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 820" role="img" aria-labelledby="hoa_system_design_v1-t hoa_system_design_v1-d" class="fts-diagram">
  <title id="hoa_system_design_v1-t">01 Agent System Design — PR Review Agent</title>
  <desc id="hoa_system_design_v1-d">A ReAct-pattern PR review agent: two entry points (mock demo, live), the ReAct loop, a five-tool registry that branches mock-vs-live, schema validation, and the external GitHub and LLM services it crosses a network boundary to reach.</desc>

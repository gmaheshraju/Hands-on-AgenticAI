    <text x="432.0" y="287.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">7 branches · safeSend</text>
    <text x="432.0" y="302.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">server.js</text>
  </g>
  <g class="d-node d-component-agent" data-id="n_turn" data-class="component.agent">
    <rect x="576" y="252" width="176" height="64" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
    <text x="664.0" y="272.5" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">TurnManager</text>
    <text x="664.0" y="287.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">5 states · VAD · timer</text>
    <text x="664.0" y="302.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label"></text>
  </g>
  <g class="d-node d-component-service" data-id="n_engine" data-class="component.service">
    <rect x="808" y="252" width="176" height="64" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="896.0" y="272.5" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">ConversationEngine</text>
    <text x="896.0" y="287.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">8 rules · 20-turn ctx</text>
    <text x="896.0" y="302.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label"></text>
  </g>
  <g class="d-node d-component-service" data-id="n_tts" data-class="component.service">
    <rect x="1040" y="252" width="176" height="64" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="1128.0" y="272.5" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">MockTTS</text>
    <text x="1128.0" y="287.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">3-word chunks · 16kHz</text>
    <text x="1128.0" y="302.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label"></text>
  </g>
  <g class="d-node d-component-service" data-id="n_stt" data-class="component.service">
    <rect x="576" y="372" width="176" height="64" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="664.0" y="392.5" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">MockSTT</text>
    <text x="664.0" y="407.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">buffers only · 5 phrases</text>
    <text x="664.0" y="422.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label"></text>
  </g>
  <g class="d-node d-component-mock" data-id="n_whisper" data-class="component.mock">
    <rect x="1384" y="268" width="248" height="64" rx="6" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="1508.0" y="288.5" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">WhisperSTT</text>
    <text x="1508.0" y="303.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">OPENAI_API_KEY · whisper-1</text>
    <text x="1508.0" y="318.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">speechToText.js</text>
  </g>
  <g class="d-node d-component-mock" data-id="n_cloud" data-class="component.mock">
    <rect x="1384" y="380" width="248" height="64" rx="6" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="1508.0" y="400.5" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">CloudTTS</text>
    <text x="1508.0" y="415.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">alloy · tts-1 · pcm stream</text>
    <text x="1508.0" y="430.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">textToSpeech.js</text>
  </g>
  <g class="d-node d-component-artifact" data-id="n_play" data-class="component.artifact">
    <rect x="1384" y="620" width="248" height="56" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="1508.0" y="636.5" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">playback queue</text>
    <text x="1508.0" y="651.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">sequential · onended</text>
    <text x="1508.0" y="666.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">voice.js</text>
  </g>
  <g class="d-node d-component-artifact" data-id="n_ui" data-class="component.artifact">
    <rect x="1384" y="692" width="248" height="48" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="1508.0" y="712.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">transcript + waveform</text>
    <text x="1508.0" y="727.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">voice.js</text>
  </g>
  <g class="d-node d-card-invariant" data-id="card_in" data-class="card.invariant">
    <rect x="304" y="488" width="456" height="124" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="312" y="504.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">CLIENT → SERVER — every switch branch, in code order</text>
    <text x="312" y="518.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 start — stt.reset · engine.reset · startConversation</text>
    <text x="312" y="532.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">2 stop — tts.cancel · endConversation</text>
    <text x="312" y="546.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">3 audio — base64 → Float32 → RMS → feedAudio + onAudioEnergy</text>
    <text x="312" y="560.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4 simulate — setNextTranscript → onCompleteUtterance → pipeline</text>
    <text x="312" y="574.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">5 interrupt — only while SPEAKING: onAudioEnergy(1.0)</text>
    <text x="312" y="588.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">6 get_history — undocumented in the protocol block</text>
    <text x="312" y="602.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">7 default — unknown type; malformed JSON errors earlier at</text>
  </g>
  <g class="d-node d-card-primitive" data-id="card_out" data-class="card.primitive">
    <rect x="792" y="488" width="456" height="124" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
    <text x="800" y="504.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">SERVER → CLIENT — all 6 types and their only emitters</text>
    <text x="800" y="518.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">state — on every stateChange, and once on connect</text>
    <text x="800" y="532.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">transcript user assistant</text>
    <text x="800" y="546.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">tts_chunk — Float32 → Buffer → base64, index/total</text>
    <text x="800" y="560.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">tts_done interrupted=true interrupted=false</text>
    <text x="800" y="574.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">history empty on start on get_history</text>
    <text x="800" y="588.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">error pipeline throw bad JSON unknown type</text>
    <text x="800" y="602.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">the browser handles exactly these six — voice.js</text>
  </g>
  <g class="d-node d-card-failure" data-id="card_dead" data-class="card.failure">
    <rect x="548" y="636" width="456" height="124" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
    <text x="556" y="652.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">MIC AUDIO CANNOT PRODUCE A TRANSCRIPT — the wired path</text>
    <text x="556" y="666.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 audio feedAudio() buffers the chunk — nothing drains it</text>
    <text x="556" y="680.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">2 MockSTT.transcribe() speechToText.js — no caller exists</text>
    <text x="556" y="694.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">3 onEndpointWithTranscript turnManager.js — no caller exists</text>
    <text x="556" y="708.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4 partialTranscript is written only by onCompleteUtterance</text>
    <text x="556" y="722.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">5 endpointDetected therefore carries transcript = &#x27;&#x27;</text>
    <text x="556" y="736.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">6 server.js returns early on falsy — the turn ends silently</text>
    <text x="556" y="750.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">mic drives VAD only; only &#x27;simulate&#x27; reaches the engine</text>
  </g>
</svg>

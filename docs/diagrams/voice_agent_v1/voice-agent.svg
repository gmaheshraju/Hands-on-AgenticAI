<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 800" role="img" aria-labelledby="hoa_voice_agent_v1-t hoa_voice_agent_v1-d" class="fts-diagram">
  <title id="hoa_voice_agent_v1-t">17 Real-Time Voice Agent — Architecture</title>
  <desc id="hoa_voice_agent_v1-d">One Node process serving HTTP and WebSocket on the same port, with a per-connection set of four objects (TurnManager, MockSTT, ConversationEngine, MockTTS), the browser capture and playback halves it talks to, and two real-provider templates that no caller constructs. Every element cites a source line in FACTS.md.</desc>

    <text x="128.0" y="302.5" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">voice.js</text>
  </g>
  <g class="d-node d-component-entry" data-id="n_demo" data-class="component.entry">
    <rect x="56" y="356" width="144" height="64" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>

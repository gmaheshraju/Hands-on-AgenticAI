  <title id="hoa_agent_harness_v1-t">03 Agent Harness — Architecture</title>
  <desc id="hoa_agent_harness_v1-d">The harness process wrapping a research agent: entry CLI, run loop with four stop conditions, tool surface over mock data, and the JSONL trace and markdown report it writes. Every element cites a source line in FACTS.md.</desc>

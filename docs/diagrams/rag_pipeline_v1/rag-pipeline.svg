  <g class="d-node d-card-invariant" data-id="card_funnel" data-class="card.invariant">
    <rect x="304" y="560" width="456" height="116" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="312" y="579.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">CANDIDATE FUNNEL — every knob, in constructor order</text>
    <text x="312" y="593.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 bm25TopK 20 · 2 vectorTopK 20 — candidates</text>
    <text x="312" y="607.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">3 fusionTopK 15 — survive RRF · 5 rrfK 60</text>
    <text x="312" y="621.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4 rerankerTopK 5 — reach the answer prompt</text>
    <text x="312" y="635.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">6 llmCall null · 7 rerankerMode &#x27;heuristic&#x27;</text>
    <text x="312" y="649.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">every one is options.X || literal — no config file, no env</text>
    <text x="312" y="663.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">20+20 → 15 → 5, applied at</text>
  </g>
  <g class="d-node d-card-failure" data-id="card_degrade" data-class="card.failure">
    <rect x="792" y="560" width="456" height="116" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
    <text x="800" y="572.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">SILENT DEGRADATIONS ON THE QUERY PATH — in call order</text>
    <text x="800" y="586.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 bm25.search: query tokenizes to nothing → [] bm25.js</text>
    <text x="800" y="600.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">2 cosineSimilarity: either norm 0 → 0 vectorSearch.js</text>
    <text x="800" y="614.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">3 rerank: no candidates → [] reranker.js</text>
    <text x="800" y="628.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4 LLM JSON unparseable → heuristic; console.warn only</text>
    <text x="800" y="642.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">5 candidate absent from LLM scores → rerankerScore 0</text>
    <text x="800" y="656.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">6 no llmCall → mockGenerateAnswer pipeline.js</text>
    <text x="800" y="670.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">7 zero chunks → fixed &#x27;not found&#x27; string — see below</text>
  </g>
  <g class="d-node d-card-primitive" data-id="card_index" data-class="card.primitive">
    <rect x="304" y="692" width="456" height="76" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
    <text x="312" y="705.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">chunker.js shouldIndex() REJECTS — complete, code order</text>
    <text x="312" y="719.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 path part in SKIP_DIRS, n=11 · 2 part starts &#x27;.&#x27;</text>
    <text x="312" y="733.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">3 ext in SKIP_EXTENSIONS, n=19 · 4 ext over 6 chars</text>
    <text x="312" y="747.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">else return true — reject is counted, never logged</text>
    <text x="312" y="761.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">the ONE throw in the whole project: fusion.js (weights len)</text>
  </g>

  <title id="hoa_rag_pipeline_v1-t">05 RAG Pipeline — Architecture</title>
  <desc id="hoa_rag_pipeline_v1-d">Hybrid codebase Q&amp;A in one Node process: a demo that supplies its own corpus, a chunker feeding two independent indexes, BM25 and vector retrieval fused by RRF, a re-ranker, and answer generation over two LLM seams that are mock by default. Every element cites a source line in FACTS.md.</desc>

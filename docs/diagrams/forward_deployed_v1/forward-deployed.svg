<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 720" role="img" aria-labelledby="hoa_forward_deployed_v1-t hoa_forward_deployed_v1-d" class="fts-diagram">
  <title id="hoa_forward_deployed_v1-t">14 Forward Deployed Engineering — Architecture</title>
  <desc id="hoa_forward_deployed_v1-d">The FDE customer-onboarding toolkit as one Node process: two pluggable connectors over a 4-method contract, a quality-scored extraction stage, a domain adapter and an eval builder that are siblings over the same corpus, a 9-check readiness gate, and the pilot dashboard it serves. Every element cites a source line in FACTS.md.</desc>

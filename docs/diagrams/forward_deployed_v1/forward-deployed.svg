    <text x="1508.0" y="491.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">served by GET /</text>
  </g>
  <g class="d-node d-card-failure" data-id="card_quality" data-class="card.failure">
    <rect x="376" y="428" width="424" height="104" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
    <text x="384" y="441.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">EXTRACTION QUALITY GATE — _assessQuality, code order</text>
    <text x="384" y="455.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">charCount == 0 → status EMPTY, score 0, hard stop</text>
    <text x="384" y="469.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">wordCount &lt; 10 → &#x27;Very short document&#x27;</text>
    <text x="384" y="483.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">alphaRatio &lt; 0.3 → &#x27;Possible garbage output&#x27;</text>
    <text x="384" y="497.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">text contains U+FFFD → &#x27;possible encoding issue&#x27;</text>
    <text x="384" y="511.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">charCount &lt; 20% of file size → &#x27;may be incomplete&#x27;</text>
    <text x="384" y="525.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">score = 1.0 - 0.15 x warnings, clamped; OK / WARNING</text>
  </g>
  <g class="d-node d-card-primitive" data-id="card_qtypes" data-class="card.primitive">
    <rect x="376" y="560" width="424" height="104" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
    <text x="384" y="573.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">EVAL CANDIDATES — all 5 types, code order, evalBuilder.js</text>
    <text x="384" y="587.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 factual · easy — dollar amounts, first 2 per doc</text>
    <text x="384" y="601.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">2 comprehension · medium — numbered sections, first 2</text>
    <text x="384" y="615.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">3 analytical · hard — risk terms, needs &gt;= 2</text>
    <text x="384" y="629.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4 extraction · easy — timeframes, needs &gt;= 2</text>
    <text x="384" y="643.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">5 application · medium — &#x27;shall&#x27; clauses, needs &gt;= 2</text>
    <text x="384" y="657.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">docs with quality FAILED are skipped before all five</text>
  </g>
  <g class="d-node d-card-invariant" data-id="card_checks" data-class="card.invariant">
    <rect x="840" y="428" width="424" height="164" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="848" y="443.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">DEPLOYMENT READINESS — all 9 checks, code order-</text>
    <text x="848" y="457.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 connector configured + tested — critical</text>
    <text x="848" y="471.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">2 documents ingested &gt;=5, failed &lt;=2 — critical</text>
    <text x="848" y="485.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">3 extraction quality &gt;= 0.7 — warning</text>
    <text x="848" y="499.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4 domain vocabulary &gt;= 10 terms — critical</text>
    <text x="848" y="513.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">5 system prompt &gt; 500 chars — critical</text>
    <text x="848" y="527.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">6 eval set &gt;= 15 accepted — critical</text>
    <text x="848" y="541.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">7 eval set file on disk, parseable — warning</text>
    <text x="848" y="555.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">8 pilot timeline days remaining &gt; 0 — warning</text>
    <text x="848" y="569.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">9 few-shot examples &gt;= 5 — warning</text>
    <text x="848" y="583.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">ready = (critical failures == 0) — warnings never block</text>
  </g>
</svg>

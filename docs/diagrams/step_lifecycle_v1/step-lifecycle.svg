<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1312" role="img" aria-labelledby="hoa_step_lifecycle_v1-t hoa_step_lifecycle_v1-d" class="fts-diagram">
  <title id="hoa_step_lifecycle_v1-t">23 Long-Running Agent — step lifecycle</title>
  <desc id="hoa_step_lifecycle_v1-d">The durable executor&#x27;s real state machine: a loop with three ways out, a six-branch recovery classifier, and a checkpoint index that decides what a resume re-runs. No step state is terminal — only the task&#x27;s three outcomes are.</desc>
  <defs>
    <marker id="hoa_step_lifecycle_v1-a-d-transition-failure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828" class="d-transition-failure-fill"/></marker>
    <marker id="hoa_step_lifecycle_v1-a-d-transition-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#232F3E" class="d-transition-normal-fill"/></marker>
    <marker id="hoa_step_lifecycle_v1-a-d-transition-revert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E65100" class="d-transition-revert-fill"/></marker>
  </defs>
  <g class="d-zone d-boundary-primary">
    <rect x="96" y="112" width="1552" height="680" rx="8" fill="none" stroke="#E7157B" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="108" y="132" fill="#E7157B" font-size="12" font-weight="600" class="d-zone-label">src/executor.js — DurableExecutor.execute() decides every step status</text>
  </g>
  <g class="d-edge d-transition-normal" data-edge="e_run">
    <polyline points="368,312.0 496,312.0" fill="none" stroke="#232F3E" stroke-width="1.75" marker-end="url(#hoa_step_lifecycle_v1-a-d-transition-normal)"/>
    <text x="432.0" y="306.0" text-anchor="middle" fill="#888888" font-size="10" class="d-edge-label">budget.check() passed</text>
  </g>
  <g class="d-edge d-transition-normal" data-edge="e_taskdone">
    <polyline points="316.0,280 316,168 1468,168 1468.0,280" fill="none" stroke="#232F3E" stroke-width="1.75" marker-end="url(#hoa_step_lifecycle_v1-a-d-transition-normal)"/>
    <text x="892.0" y="162.0" text-anchor="middle" fill="#888888" font-size="10" class="d-edge-label">no steps left</text>
  </g>
  <g class="d-edge d-transition-failure" data-edge="e_budget">
    <polyline points="264.0,344 264,712 1352,712.0" fill="none" stroke="#C62828" stroke-width="1.75" marker-end="url(#hoa_step_lifecycle_v1-a-d-transition-failure)"/>
    <text x="808.0" y="706.0" text-anchor="middle" fill="#888888" font-size="10" class="d-edge-label">budget.check() failed</text>
  </g>
  <g class="d-edge d-transition-normal" data-edge="e_done">
    <polyline points="688,312.0 824,312.0" fill="none" stroke="#232F3E" stroke-width="1.75" marker-end="url(#hoa_step_lifecycle_v1-a-d-transition-normal)"/>
    <text x="756.0" y="306.0" text-anchor="middle" fill="#888888" font-size="10" class="d-edge-label">handler resolved</text>
  </g>
  <g class="d-edge d-transition-failure" data-edge="e_fail">
    <polyline points="640.0,344 640.0,488" fill="none" stroke="#C62828" stroke-width="1.75" marker-end="url(#hoa_step_lifecycle_v1-a-d-transition-failure)"/>
    <text x="640.0" y="410.0" text-anchor="middle" fill="#888888" font-size="10" class="d-edge-label">handler threw, or the timeout fired</text>
  </g>
  <g class="d-edge d-transition-revert" data-edge="e_next">
    <polyline points="928.0,280 928,200 144,200 144,312 160,312.0" fill="none" stroke="#E65100" stroke-width="1.75" marker-end="url(#hoa_step_lifecycle_v1-a-d-transition-revert)"/>
    <text x="536.0" y="194.0" text-anchor="middle" fill="#888888" font-size="10" class="d-edge-label">more steps remain — checkpoint at i+1</text>
  </g>
  <g class="d-edge d-transition-revert" data-edge="e_retry">
    <polyline points="496,520.0 432,520 432,416 544,416 544.0,344" fill="none" stroke="#E65100" stroke-width="1.75" marker-end="url(#hoa_step_lifecycle_v1-a-d-transition-revert)"/>
    <text x="488.0" y="410.0" text-anchor="middle" fill="#888888" font-size="10" class="d-edge-label">classifier: retry</text>
  </g>
  <g class="d-edge d-transition-failure" data-edge="e_skip">
    <polyline points="688,520.0 824,520.0" fill="none" stroke="#C62828" stroke-width="1.75" marker-end="url(#hoa_step_lifecycle_v1-a-d-transition-failure)"/>
    <text x="756.0" y="514.0" text-anchor="middle" fill="#888888" font-size="10" class="d-edge-label">classifier: skip</text>
  </g>
  <g class="d-edge d-transition-failure" data-edge="e_abort">
    <polyline points="592.0,552 592,616 1468,616 1468.0,552" fill="none" stroke="#C62828" stroke-width="1.75" marker-end="url(#hoa_step_lifecycle_v1-a-d-transition-failure)"/>
    <text x="1030.0" y="610.0" text-anchor="middle" fill="#888888" font-size="10" class="d-edge-label">classifier: abort</text>
  </g>
  <g class="d-edge d-transition-revert" data-edge="e_skipnext">
    <polyline points="1032,520.0 1120,520 1120,232 264,232 264.0,280" fill="none" stroke="#E65100" stroke-width="1.75" marker-end="url(#hoa_step_lifecycle_v1-a-d-transition-revert)"/>
    <text x="692.0" y="226.0" text-anchor="middle" fill="#888888" font-size="10" class="d-edge-label">more steps remain — checkpoint at i+1</text>
  </g>
  <g class="d-node d-state-initial" data-id="n_next" data-class="state.initial">
    <rect x="160" y="280" width="208" height="64" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="264.0" y="308.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">step i selected</text>
    <text x="264.0" y="323.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">budget is checked here</text>
  </g>
  <g class="d-node d-state-active" data-id="s_running" data-class="state.active">
    <rect x="496" y="280" width="192" height="64" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2"/>
    <text x="592.0" y="308.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">running</text>
    <text x="592.0" y="323.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">handler in flight</text>
  </g>
  <g class="d-node d-state-transitional" data-id="s_done" data-class="state.transitional">
    <rect x="824" y="280" width="208" height="64" rx="6" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.5"/>
    <text x="928.0" y="308.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">completed</text>
    <text x="928.0" y="323.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">step result recorded</text>
  </g>
  <g class="d-node d-state-terminal" data-id="t_taskdone" data-class="state.terminal">
    <rect x="1352" y="280" width="232" height="64" rx="6" fill="#ECEFF1" stroke="#455A64" stroke-width="3"/>
    <text x="1468.0" y="308.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">TASK COMPLETED</text>
    <text x="1468.0" y="323.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">terminal — loop exhausted</text>
  </g>
  <g class="d-node d-state-transitional" data-id="s_failed" data-class="state.transitional">
    <rect x="496" y="488" width="192" height="64" rx="6" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.5"/>
    <text x="592.0" y="516.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">failed</text>
    <text x="592.0" y="531.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">recovery decides next</text>
  </g>
  <g class="d-node d-state-transitional" data-id="s_skipped" data-class="state.transitional">
    <rect x="824" y="488" width="208" height="64" rx="6" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.5"/>
    <text x="928.0" y="516.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">skipped</text>
    <text x="928.0" y="531.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">loop continues</text>
  </g>
  <g class="d-node d-state-terminal" data-id="t_abort" data-class="state.terminal">
    <rect x="1352" y="488" width="232" height="64" rx="6" fill="#ECEFF1" stroke="#455A64" stroke-width="3"/>
    <text x="1468.0" y="516.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">TASK ABORTED</text>
    <text x="1468.0" y="531.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">terminal — recovery gave up</text>
  </g>
  <g class="d-node d-state-terminal" data-id="t_budget" data-class="state.terminal">
    <rect x="1352" y="680" width="232" height="64" rx="6" fill="#ECEFF1" stroke="#455A64" stroke-width="3"/>
    <text x="1468.0" y="708.0" text-anchor="middle" font-size="12" fill="#232F3E" font-weight="700" class="d-label d-bold">BUDGET EXCEEDED</text>
    <text x="1468.0" y="723.0" text-anchor="middle" font-size="12" fill="#232F3E" class="d-label">terminal — stopped at the gate</text>
  </g>
  <g class="d-node d-card-invariant" data-id="card_classifier" data-class="card.invariant">
    <rect x="96" y="824" width="1552" height="208" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="104" y="854.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">THE RECOVERY CLASSIFIER — COMPLETE, IN CODE ORDER</text>
    <text x="104" y="868.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">selectStrategy() computes retriesLeft = (step.retries ?? 0) − retriesUsed, then returns the FIRST branch that matches:</text>
    <text x="104" y="882.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1. timeout, retries remain → retry; backoff 100ms × attempt, and the step&#x27;s timeout is doubled</text>
    <text x="104" y="896.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">2. rate limit, retries remain → retry; exponential backoff, capped at 16s</text>
    <text x="104" y="910.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">3. auth error → ABORT unconditionally — never retried, never skipped, whatever the step says</text>
    <text x="104" y="924.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4. data / validation / parse error → skip if the step is optional, abort if it is critical</text>
    <text x="104" y="938.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">5. any other error, retries remain → retry; backoff 200ms × attempt</text>
    <text x="104" y="952.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">6. retries exhausted → skip if optional, abort if critical</text>
    <text x="104" y="966.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">Branches 1 and 2 FALL THROUGH: each return sits INSIDE its retries-remain test, so once retries are gone the error is</text>
    <text x="104" y="980.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">re-classified by branches 3-6. An exhausted timeout is decided by branch 6, not branch 1.</text>
    <text x="104" y="994.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">Branch 1 also matches on error.code, not on the message — the executor&#x27;s own timeout says &#x27;timed out&#x27;, which does not</text>
    <text x="104" y="1008.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">contain the substring &#x27;timeout&#x27; that the first half of that test looks for.</text>
  </g>
  <g class="d-node d-card-invariant" data-id="card_checkpoint" data-class="card.invariant">
    <rect x="96" y="1064" width="760" height="176" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="104" y="1099.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">THE CHECKPOINT INDEX IS THE DURABILITY CONTRACT</text>
    <text x="104" y="1113.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">saveCheckpoint stores currentStepIndex, and a resume reads it back as its</text>
    <text x="104" y="1127.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">starting point. Every call site passes one of exactly two values:</text>
    <text x="104" y="1141.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">i + 1 — the step finished; resume starts AFTER it. Used on completed, on a</text>
    <text x="104" y="1155.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">retry that succeeded, and on both kinds of skip.</text>
    <text x="104" y="1169.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">i — the step did NOT finish; resume RE-RUNS it. Used on the budget stop, on</text>
    <text x="104" y="1183.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">a critical failure, and on an abort.</text>
    <text x="104" y="1197.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">So a step that ran halfway and then aborted executes again from the start. A</text>
    <text x="104" y="1211.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">handler with side effects that is not idempotent applies them twice.</text>
  </g>
  <g class="d-node d-card-failure" data-id="card_reported" data-class="card.failure">
    <rect x="888" y="1064" width="760" height="208" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
    <text x="896" y="1101.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">TWO STATUSES ARE REPORTED BUT NEVER STORED</text>
    <text x="896" y="1115.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">On every retry the executor records one status and streams a different one</text>
    <text x="896" y="1129.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">for the SAME event: the timeline gets &#x27;running&#x27;, the onProgress callback</text>
    <text x="896" y="1143.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">gets &#x27;retrying&#x27;. RAN — the stream reads running, retrying, retrying,</text>
    <text x="896" y="1157.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">completed, while the recorded timeline contains no &#x27;retrying&#x27; at all.</text>
    <text x="896" y="1171.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">The budget stop is the mirror image. The event that is both recorded and</text>
    <text x="896" y="1185.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">streamed says &#x27;aborted&#x27;, while the value returned to the caller says</text>
    <text x="896" y="1199.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">&#x27;budget_exceeded&#x27;. RAN — return budget_exceeded, last streamed aborted.</text>
    <text x="896" y="1213.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">So the live stream, the stored timeline and the return value are three</text>
    <text x="896" y="1227.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">vocabularies for the same events. Anything built on one — a dashboard, an</text>
    <text x="896" y="1241.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">alert, a test — disagrees with the other two.</text>
  </g>
</svg>

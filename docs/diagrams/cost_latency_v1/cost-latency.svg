  <title id="hoa_cost_latency_v1-t">11 Cost &amp; Latency — Architecture</title>
  <desc id="hoa_cost_latency_v1-d">The cost-optimization pipeline for a simulated support agent: two CLI entries over a 50-conversation fixture, five per-turn stages with the semantic cache first and short-circuiting, a MOCK model boundary carrying the price table and the canned response corpus, and the stdout comparison table. Every element cites a source line in FACTS.md.</desc>

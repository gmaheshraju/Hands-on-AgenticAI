    <text x="816" y="547.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">routeToModel — simple→cheap, medium→mid, complex→frontier</text>
    <text x="816" y="561.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">TTFT floor 300/150/100ms feeds perceivedLatency</text>
  </g>

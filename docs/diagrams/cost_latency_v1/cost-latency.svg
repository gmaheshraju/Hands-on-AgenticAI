  <g class="d-node d-card-invariant" data-id="card_pipe" data-class="card.invariant">
    <rect x="320" y="448" width="456" height="136" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="328" y="463.0" text-anchor="start" font-size="11" fill="#232F3E" font-weight="700" class="d-label d-bold">PER-TURN PIPELINE — complete, in code order · benchmark.js</text>
    <text x="328" y="477.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">1 cache.lookup — HIT ⇒ cost 0, 2ms, continue</text>
    <text x="328" y="491.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">2 summarizeHistory — no-op unless &gt;4 msgs; prompt swap</text>
    <text x="328" y="505.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">3 classifyComplexity → routeToModel — tier chosen</text>
    <text x="328" y="519.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">4 simulateLLMCall — the only token spend in the loop</text>
    <text x="328" y="533.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">5 applyEarlyTermination — cost × (0.5 + 0.5·ratio)</text>
    <text x="328" y="547.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">6 perceivedLatency — TTFT replaces total latency</text>
    <text x="328" y="561.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">7 cache.store — every miss is written back</text>
    <text x="328" y="575.0" text-anchor="start" font-size="11" fill="#232F3E" class="d-label">README&#x27;s ASCII draws compression 1st; the code checks the cache 1st.</text>
  </g>

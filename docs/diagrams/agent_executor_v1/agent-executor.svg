<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 800" role="img" aria-labelledby="hoa_agent_executor_v1-t hoa_agent_executor_v1-d" class="fts-diagram">
  <title id="hoa_agent_executor_v1-t">25 Agent Executor — Zero-Trust IAM Pipeline for AI Agents</title>
  <desc id="hoa_agent_executor_v1-d">One in-memory Node process that runs every agent action through a 5-gate execute() pipeline — schema, IAM policy, human approval, sandboxed execution — and records every branch to an audit trail. The sandbox&#x27;s permission checks are demonstrated but NOT wired into gate 4. Every element cites a source line in FACTS.md.</desc>
